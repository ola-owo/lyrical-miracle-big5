[project]
name = "lyrical-miracle-big5"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.12.0",
    "peft>=0.19.1",
    "sentence-transformers>=5.5.1",
    "litserve>=0.2.17",
]

[dependency-groups]
dev = [
    "fastapi>=0.136.3",
    "httpx2>=2.3.0",
    "pytest>=9.0.3",
]
train = [
    "polars>=1.41.2",
    "wandb>=0.27.2",
    "datasets>=2.19.1",
]

[project.scripts]
serve = "big5.serve:main"

# [tool.uv.sources]
# torch = { index = "pytorch-gpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu132"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "big5"
module-root = ""

[tool.ruff.format]
quote-style = "single"
