[project]
name = "lyrical-miracle-big5"
version = "0.7.0"
requires-python = ">=3.13"
dependencies = [
    "peft>=0.19.1",
    "sentence-transformers>=5.5.1",
    "litserve>=0.2.17",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
cpu = ["torch>=2.12.0"]
cuda = ["torch>=2.12.0"]

[dependency-groups]
dev = [
    "fastapi>=0.136.3",
    "httpx2>=2.3.0",
    "pytest>=9.0.3",
    "marimo>=0.23.9",
]
train = [
    "polars>=1.41.2",
    "wandb>=0.27.2",
    "datasets>=2.19.1",
    "ipython>=9.15.0",
]

[project.scripts]
serve = "big5.serve:main"

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.build-backend]
module-name = "big5"
module-root = ""

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff.format]
quote-style = "single"
