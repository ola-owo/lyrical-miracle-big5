requires-python = ">=3.13"
dependencies = [
    "datasets>=2.19.1",
    "peft>=0.19.1",
    "polars>=1.41.2",
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
    "wandb>=0.27.2",
